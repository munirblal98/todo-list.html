<!DOCTYPE html>
<html>
<head>
  <title>To-do List</title>

  <style>
    body {
      font-family: Arial;
    }

    .todo-grid,
    .todo-input-grid {
      display: grid;
      grid-template-columns: 200px 150px 100px;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }

    .todo-input-grid {
      margin-bottom: 10px;
    }

    .name-input,
    .due-date-input {
      font-size: 15px;
      padding: 6px;
    }

    .add-todo-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 8px;
      cursor: pointer;
    }

    .delete-todo-button {
      background-color: darkred;
      color: white;
      border: none;
      font-size: 15px;
      padding: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <p>Todo List</p>

  <div class="todo-input-grid">

    <input 
      placeholder="Todo Name"
      class="js-name-input name-input"
    >

    <input 
      type="date"
      class="js-due-date-input due-date-input"
    >

    <button 
      onclick="addTodo();"
      class="add-todo-button"
    >
      Add
    </button>

  </div>

  <div class="js-todo-list todo-grid"></div>

  <script>

    const todolist = [
      {
        name: 'make dinner',
        dueDate: '2022-12-22'
      },
      {
        name: 'wash dishes',
        dueDate: '2022-12-22'
      }
    ];

    renderTodoList();

    function renderTodoList() {

      let todoListHTML = '';

      for (let i = 0; i < todolist.length; i++) {

        const todoObject = todolist[i];

        const { name, dueDate } = todoObject;

        const html = `
          <div>${name}</div>
          <div>${dueDate}</div>

          <button 
            onclick="
              todolist.splice(${i}, 1);
              renderTodoList();
            "
            class="delete-todo-button"
          >
            Delete
          </button>
        `;

        todoListHTML += html;
      }

      document.querySelector('.js-todo-list').innerHTML = todoListHTML;
    }

    function addTodo() {

      const inputElement =
        document.querySelector('.js-name-input');

      const name = inputElement.value;

      const dateInputElement =
        document.querySelector('.js-due-date-input');

      const dueDate = dateInputElement.value;

      if (name === '' || dueDate === '') {
        alert('Please fill all fields');
        return;
      }

      todolist.push({
        name: name,
        dueDate: dueDate
      });

      inputElement.value = '';
      dateInputElement.value = '';

      renderTodoList();
    }

  </script>

</body>
</html>
